name: Update PocketBase Version

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: latest
        name: Get latest PocketBase release
        run: |
          release="$(curl -fsS --get 'https://ganigeorgiev.com/api/collections/releases/records' \
            --data-urlencode 'perPage=1' \
            --data-urlencode 'skipTotal=1' \
            --data-urlencode 'sort=-semver' \
            --data-urlencode 'filter=draft=false && channel.repository="zp5ouhdxhh8k2o0" && channel.name="default"' \
            | jq -r '.items[0] | "\(.tag) \(.id)"')"
          tag_name="${release% *}"
          release_id="${release#* }"
          if [ -z "$tag_name" ] || [ "$tag_name" = "null" ] || [ -z "$release_id" ]; then
            echo "Error: could not resolve latest release: $release"
            exit 1
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile.pocketbase with latest PocketBase release
        run: |
          latest_version="${{ steps.latest.outputs.tag_name }}"
          sed -i "s/^ARG PB_VERSION=.*/ARG PB_VERSION=${latest_version#v}/" Dockerfile.pocketbase
          sed -i "s/^ARG PB_RELEASE_ID=.*/ARG PB_RELEASE_ID=${{ steps.latest.outputs.release_id }}/" Dockerfile.pocketbase

      - id: cpr
        name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update-pocketbase-version
          commit-message: "chore(deps): Update PocketBase version to ${{ steps.latest.outputs.tag_name }}"
          title: "chore(deps): Update PocketBase version to ${{ steps.latest.outputs.tag_name }}"
          body: |
            Update PocketBase version to ${{ steps.latest.outputs.tag_name }}.

      - name: Enable Pull Request Automerge
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
